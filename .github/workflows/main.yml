name: jobwatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 jobwatch.py

      - name: Save state
        run: |
          git config user.name "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          cp seen.json /tmp/local.json 2>/dev/null || echo '{"jobs":{}}' > /tmp/local.json
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -c "import json,os;l=json.load(open('/tmp/local.json'))['jobs'];p='seen.json';r=json.load(open(p))['jobs'] if os.path.exists(p) else {};r.update({k:v for k,v in l.items() if k not in r});json.dump({'jobs':r},open(p,'w'),ensure_ascii=False)"
            git add seen.json
            git diff --cached --quiet && break
            git commit -q -m "update seen"
            git push -q && break
            sleep 3
          done
