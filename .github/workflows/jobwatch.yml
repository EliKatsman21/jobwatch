name: jobwatch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay runs a few minutes under load
  workflow_dispatch:
    inputs:
      replay:
        description: "Test: send up to 5 currently-open matching jobs (saves nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 jobwatch.py ${{ inputs.replay && '--replay' || '' }}

      - name: Save state
        if: ${{ !inputs.replay }}
        run: |
          git config user.name "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          cp seen.json /tmp/local.json 2>/dev/null || echo '{"jobs":{}}' > /tmp/local.json
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -c "import json,os;L=json.load(open('/tmp/local.json'));p='seen.json';R=json.load(open(p)) if os.path.exists(p) else {'jobs':{}};R['jobs'].update({k:v for k,v in L['jobs'].items() if k not in R['jobs']});R['sources']=sorted(set(R.get('sources',[]))|set(L.get('sources',[])));json.dump(R,open(p,'w'),ensure_ascii=False)"
            git add seen.json
            git diff --cached --quiet && break
            git commit -q -m "update seen"
            git push -q && break
            sleep 3
          done
